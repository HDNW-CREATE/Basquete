<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1633">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CUBOLA — Estrela das Quadras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   CUBOLA — estilos (mobile-first, retrato 9:16)
   Todas as medidas em "em": o tamanho base escala com a largura do palco.
   ===================================================================== */
:root {
  --navy: #0e1633; --navy2: #18224a; --blue: #2b55e6; --blue2: #1b3bb0; --sky: #55b8ff;
  --yellow: #ffc928; --yellow2: #e29a00; --orange: #ff7a1a; --mint: #3ee6a8; --red: #ff4d4d; --pink: #ff5bd8;
  --ink: #0a0f24; --sw: 360px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; overscroll-behavior: none; touch-action: none; }
body { font-family: 'Lilita One', 'Arial Black', 'Segoe UI', system-ui, sans-serif; color: #fff; }
#stage { position: relative; width: min(100vw, 62vh); width: min(100vw, 62dvh); height: 100vh; height: 100dvh; margin: 0 auto; overflow: hidden; background: #7fb6f5; }
#gl, #touch, #ui { position: absolute; inset: 0; width: 100%; height: 100%; }
#gl { display: block; }
#touch { touch-action: none; }
#ui { pointer-events: none; font-size: calc(var(--sw) * 0.04); letter-spacing: .02em; }
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }
.out { text-shadow: 0 .09em 0 var(--ink), .06em 0 0 var(--ink), -.06em 0 0 var(--ink), 0 -.06em 0 var(--ink), .05em .09em 0 var(--ink), -.05em .09em 0 var(--ink); }

/* ---------- botões ---------- */
button { font: inherit; color: #fff; border: 0; cursor: pointer; padding: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35em; padding: .55em 1em; border-radius: .6em; font-size: 1.15em;
  background: var(--blue); box-shadow: 0 .26em 0 var(--blue2), 0 .4em .5em rgba(0, 0, 0, .35); text-shadow: 0 .08em 0 rgba(0, 0, 0, .45); transition: transform .06s; }
.btn:active { transform: translateY(.2em); box-shadow: 0 .06em 0 var(--blue2); }
.btn.y { background: linear-gradient(#ffe066, var(--yellow)); box-shadow: 0 .26em 0 var(--yellow2), 0 .4em .5em rgba(0, 0, 0, .35); color: #4a2c00; text-shadow: 0 .06em 0 rgba(255, 255, 255, .5); }
.btn.g { background: linear-gradient(#63e06a, #2fb344); box-shadow: 0 .26em 0 #1b7f2d, 0 .4em .5em rgba(0, 0, 0, .35); }
.btn.r { background: var(--red); box-shadow: 0 .26em 0 #b22a2a; }
.btn.d { background: #4a557f; box-shadow: 0 .26em 0 #2c3454; }
.btn.sm { font-size: .9em; padding: .4em .7em; }
.btn[disabled] { filter: grayscale(.8) brightness(.75); pointer-events: none; }
.big { font-size: 1.7em; padding: .6em 1.2em; border-radius: .5em; width: 100%; }

/* ---------- barra superior ---------- */
#top { position: absolute; top: max(.6em, env(safe-area-inset-top)); left: 0; right: 0; display: flex; gap: .35em; padding: 0 .6em; align-items: center; z-index: 5; }
.chip { flex: 1; display: flex; align-items: center; gap: .25em; background: rgba(10, 15, 36, .82); border-radius: .5em; padding: .28em .45em .28em .3em; font-size: .95em; min-width: 0; box-shadow: inset 0 -.12em 0 rgba(0, 0, 0, .4); }
.chip .ic { font-size: 1.05em; } .chip span:last-child { margin-left: auto; }
.chip.lvl { flex: 1.5; position: relative; padding-left: 1.9em; }
.chip.lvl b { position: absolute; left: -.15em; top: -.2em; width: 1.9em; height: 1.9em; display: grid; place-items: center; background: var(--sky); border: .14em solid #fff; border-radius: .5em .5em .9em .9em; font-size: 1.05em; text-shadow: 0 .08em 0 rgba(0, 0, 0, .4); }
.bar { position: relative; flex: 1; height: 1.25em; background: #060a1c; border-radius: .3em; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#6fd0ff, #2b8fe6); width: 0; }
.bar span { position: relative; display: block; text-align: center; font-size: .8em; line-height: 1.55em; }
.chip.en { background: linear-gradient(#35c24a, #1f8f33); }
.sq { width: 2.1em; height: 2.1em; border-radius: .5em; background: #2a3358; box-shadow: 0 .16em 0 #141a35; font-size: 1em; flex: none; }

/* ---------- tela inicial ---------- */
#home { position: absolute; inset: 0; pointer-events: none !important; }
#home > * { pointer-events: auto; }
#home .season { position: absolute; top: 4.1em; left: 0; right: 0; text-align: center; font-size: 1.25em; color: var(--yellow); }
#home .season small { display: block; color: #fff; font-size: .72em; }
#home .cards { position: absolute; top: 7.6em; left: .7em; right: .7em; display: flex; gap: .6em; }
.card { flex: 1; background: linear-gradient(#22306b, #17214d); border: .12em solid #3a4a93; border-radius: .6em; padding: .45em .55em; box-shadow: 0 .25em 0 #0b1130; font-size: .86em; min-width: 0; }
.card h4 { margin: 0 0 .25em; font-weight: 400; font-size: 1em; color: var(--yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .bar { height: 1.1em; }
.col { position: absolute; top: 13.4em; display: flex; flex-direction: column; gap: .75em; }
.col.l { left: .7em; } .col.r { right: .7em; }
.ibtn { width: 4.5em; padding: .4em .1em .3em; border-radius: .6em; background: linear-gradient(#333d6b, #232b52); box-shadow: 0 .22em 0 #10152f; text-align: center; position: relative; }
.ibtn i { display: block; font-style: normal; font-size: 1.9em; line-height: 1.1; }
.ibtn span { font-size: .68em; display: block; }
.ibtn .dot, .nav .dot { position: absolute; top: -.3em; right: -.3em; width: 1.2em; height: 1.2em; border-radius: 50%; background: var(--red); border: .12em solid #fff; font-size: .8em; display: grid; place-items: center; }
.stat { width: 4.5em; border-radius: .6em; background: rgba(10, 15, 36, .85); text-align: center; padding: .25em 0 .2em; box-shadow: 0 .22em 0 #05081a; }
.stat b { display: block; font-size: 1.7em; font-weight: 400; line-height: 1.05; }
.stat span { font-size: .68em; color: var(--mint); }
.stat.rate b { color: #6dff5c; }
#home .play { position: absolute; left: 2.6em; right: 2.6em; bottom: 6.6em; text-align: center; }
#home .play small { display: block; margin-top: .7em; font-size: .85em; opacity: .95; }

/* ---------- navegação inferior ---------- */
#nav { position: absolute; left: 0; right: 0; bottom: 0; height: 5.2em; display: flex; background: var(--navy); border-top: .15em solid #05081a; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.nav { flex: 1; background: none; position: relative; font-size: 1em; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.nav i { font-style: normal; font-size: 2.1em; line-height: 1; transition: transform .12s; }
.nav span { font-size: .75em; display: none; }
.nav.on { background: linear-gradient(#4a63f0, #3146c4); border-radius: .7em .7em 0 0; margin-top: -.6em; box-shadow: 0 -.15em 0 #1b2b8a inset; }
.nav.on i { transform: translateY(-.1em) scale(1.08); } .nav.on span { display: block; }
.nav .dot { top: .5em; right: 18%; }

/* ---------- painéis (loja, liga, eventos, estilo de vida) ---------- */
#panel { position: absolute; inset: 0; background: linear-gradient(#1a3a8f, #12256a 40%, #0e1a4d); padding: 3.9em 0 5.2em; }
#panel-in { height: 100%; overflow-y: auto; padding: .6em .8em 1.5em; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.h1 { text-align: center; font-size: 1.35em; margin: .3em 0 .6em; }
.blk { background: linear-gradient(#22306b, #17214d); border: .12em solid #3a4a93; border-radius: .7em; padding: .7em; margin-bottom: .8em; box-shadow: 0 .3em 0 #0b1130; }
.blk h3 { margin: 0 0 .4em; font-weight: 400; font-size: 1.15em; color: var(--yellow); display: flex; align-items: center; gap: .4em; }
.blk p { margin: .2em 0 .5em; font-family: system-ui, sans-serif; font-weight: 700; font-size: .78em; line-height: 1.35; color: #cfd8ff; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: .5em; } .row > .grow { flex: 1; min-width: 0; }
.row + .row { margin-top: .5em; }
.ic2 { font-size: 2em; width: 1.4em; text-align: center; flex: none; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4em; }
.gbtn { background: #2a3566; border-radius: .5em; padding: .4em .1em; font-size: .68em; text-align: center; box-shadow: 0 .2em 0 #131a3d; }
.gbtn i { display: block; font-style: normal; font-size: 2em; }
.kv { display: flex; gap: .4em; margin: .5em 0; } .kv div { flex: 1; background: #101a45; border-radius: .5em; text-align: center; padding: .3em; }
.kv small { display: block; color: var(--mint); font-size: .75em; } .kv b { font-weight: 400; font-size: 1.3em; }
.stars { color: #2a3566; position: relative; display: inline-block; font-family: system-ui; letter-spacing: .05em; white-space: nowrap; }
.stars i { position: absolute; left: 0; top: 0; overflow: hidden; color: var(--yellow); font-style: normal; white-space: nowrap; }
.req { display: flex; align-items: center; gap: .5em; font-size: .9em; margin: .35em 0; } .req b { margin-left: auto; font-weight: 400; padding: .1em .5em; border-radius: .4em; background: #101a45; }
.req b.ok { background: #1f8f33; }
table { width: 100%; border-collapse: collapse; font-size: .85em; }
td, th { padding: .32em .25em; text-align: center; font-weight: 400; } td:nth-child(2), th:nth-child(2) { text-align: left; }
tr.me { background: rgba(255, 201, 40, .22); } th { color: var(--mint); font-size: .85em; } tr + tr td { border-top: .06em solid rgba(255, 255, 255, .08); }
.tdot { display: inline-block; width: .8em; height: .8em; border-radius: .2em; margin-right: .35em; vertical-align: -.05em; border: .08em solid rgba(255, 255, 255, .6); }
/* estilo de vida */
.life { display: flex; align-items: center; gap: .7em; padding: .5em 0; position: relative; }
.life .pic { width: 3.6em; height: 3.6em; border-radius: .6em; display: grid; place-items: center; font-size: 1.25em; background: #1c2a66; border: .14em solid #3a4a93; flex: none; z-index: 1; }
.life.on .pic { background: linear-gradient(#ff9a3d, #d9601a); border-color: #ffc37a; }
.life.lock .pic { filter: grayscale(1) brightness(.6); }
.life:not(:last-child)::after { content: ''; position: absolute; left: 2.15em; top: 4.2em; bottom: -1em; width: .3em; background: #3a4a93; }
.life.on:not(:last-child)::after { background: var(--orange); }
.life h4 { margin: 0; font-weight: 400; color: var(--yellow); } .life small { font-family: system-ui; font-weight: 700; font-size: .72em; color: #cfd8ff; letter-spacing: 0; }
.life .lv { width: 3.6em; text-align: center; color: var(--sky); font-size: .85em; flex: none; } .life.on .lv { color: var(--orange); }

/* ---------- pré-jogo ---------- */
#pre { position: absolute; inset: 0; pointer-events: none !important; } #pre > * { pointer-events: auto; }
#pre .hd { position: absolute; top: 4.2em; left: 0; right: 0; text-align: center; font-size: 1.3em; }
#pre .vs { position: absolute; top: 7.4em; left: .5em; right: .5em; display: flex; justify-content: space-between; align-items: flex-start; text-align: center; }
#pre .vs div { width: 44%; } #pre .vs h3 { margin: 0; font-weight: 400; font-size: 1.05em; color: var(--sky); }
#pre .vs em { font-style: normal; font-size: 1.5em; margin-top: .3em; }
.pos { display: inline-block; background: var(--ink); border-radius: .4em; padding: .05em .5em; font-size: .85em; margin-left: .3em; }
#pre .bot { position: absolute; left: .6em; right: .6em; bottom: 1em; }
.goalbox { background: rgba(14, 22, 51, .92); border: .12em solid #3a4a93; border-radius: .6em; padding: .45em .6em; margin-bottom: .6em; font-size: .85em; }
.goalbox .g { display: flex; justify-content: space-between; margin: .12em 0; } .goalbox .g span:last-child { color: var(--yellow); }
.slots { display: flex; gap: .5em; align-items: center; margin-bottom: .7em; }
.slot { width: 3.4em; height: 3.4em; border-radius: .5em; background: #17214d; border: .12em dashed #5a6cc0; font-size: 1.2em; display: grid; place-items: center; }
.slot.on { border-style: solid; border-color: var(--yellow); background: #2a3a85; }

/* ---------- HUD da partida ---------- */
#hud { position: absolute; inset: 0; pointer-events: none !important; } #hud > * { pointer-events: auto; }
#sb { position: absolute; top: max(.6em, env(safe-area-inset-top)); left: .6em; background: rgba(10, 15, 36, .9); border-radius: .6em; padding: .3em .5em .35em; min-width: 9.6em; pointer-events: none !important; }
#sb .ln { display: flex; align-items: center; justify-content: center; gap: .35em; font-size: 1.25em; }
#sb .tm { font-size: .68em; padding: .1em .4em; border-radius: .3em; border: .1em solid rgba(255, 255, 255, .7); }
#sb .inf { display: flex; justify-content: center; gap: .5em; font-size: .85em; margin-top: .15em; align-items: center; }
#sb-sh { background: #000; color: #ffb000; border-radius: .3em; padding: 0 .4em; min-width: 1.9em; text-align: center; } #sb-sh.low { color: #ff3b3b; }
#sb .fl { font-size: .6em; text-align: center; color: #aab4e8; margin-top: .2em; font-family: system-ui; font-weight: 700; letter-spacing: 0; }
#btn-pause { position: absolute; top: max(.6em, env(safe-area-inset-top)); right: .6em; }
#goals { position: absolute; top: max(.6em, env(safe-area-inset-top)); right: 3.3em; display: flex; flex-direction: column; gap: .2em; align-items: flex-end; pointer-events: none !important; }
#goals div { background: rgba(10, 15, 36, .8); border-radius: .4em; padding: .1em .45em; font-size: .68em; } #goals div.ok { background: #1f8f33; }
#mystats { position: absolute; top: 6.5em; left: .6em; font-size: .72em; background: rgba(10, 15, 36, .7); border-radius: .4em; padding: .15em .5em; pointer-events: none !important; }
#hint { position: absolute; left: 0; right: 0; bottom: 12.5em; text-align: center; font-size: .95em; color: var(--yellow); pointer-events: none !important; }
#aimlbl { position: absolute; transform: translate(-50%, -100%); font-size: 1.5em; color: var(--yellow); pointer-events: none !important; white-space: nowrap; }
#aimlbl.good { color: #6dff5c; font-size: 1.8em; }
.act { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .72em; line-height: 1.05;
  background: radial-gradient(circle at 35% 30%, #5d7bff, var(--blue) 60%); box-shadow: 0 .3em 0 var(--blue2), 0 .5em .6em rgba(0, 0, 0, .4); border: .15em solid rgba(255, 255, 255, .85); touch-action: none; }
.act i { font-style: normal; font-size: 2em; line-height: 1; } .act:active { transform: translateY(.2em) scale(.96); }
.act.y { background: radial-gradient(circle at 35% 30%, #fff08a, var(--yellow) 60%); box-shadow: 0 .3em 0 var(--yellow2), 0 .5em .6em rgba(0, 0, 0, .4); color: #4a2c00; }
.act.o { background: radial-gradient(circle at 35% 30%, #ffb27a, var(--orange) 60%); box-shadow: 0 .3em 0 #b84e00, 0 .5em .6em rgba(0, 0, 0, .4); }
.act.warn { background: radial-gradient(circle at 35% 30%, #ff9a9a, var(--red) 60%); box-shadow: 0 .3em 0 #a02222; }
.act.s1 { right: 1.2em; bottom: 2.2em; width: 7.4em; height: 7.4em; font-size: .82em; }
.act.s2 { right: 8.8em; bottom: 1.6em; width: 6.2em; height: 6.2em; }
.act.s3 { right: 1.6em; bottom: 10.6em; width: 6.2em; height: 6.2em; }
.act.s4 { right: 8.4em; bottom: 8.6em; width: 6.2em; height: 6.2em; }
#stick { position: absolute; width: 8.4em; height: 8.4em; margin: -4.2em 0 0 -4.2em; border-radius: 50%; background: rgba(255, 255, 255, .16); border: .14em solid rgba(255, 255, 255, .5); display: none; pointer-events: none; font-size: calc(var(--sw) * 0.04); }
#knob { position: absolute; left: 50%; top: 50%; width: 3.6em; height: 3.6em; border-radius: 50%; background: rgba(255, 255, 255, .85); transform: translate(-50%, -50%); box-shadow: 0 .2em .4em rgba(0, 0, 0, .4); }
#joyhint { position: absolute; left: 1.4em; bottom: 3em; width: 7em; height: 7em; border-radius: 50%; border: .14em dashed rgba(255, 255, 255, .45); display: grid; place-items: center; font-size: .8em; text-align: center; color: rgba(255, 255, 255, .7); pointer-events: none !important; }
#btn-rew { position: absolute; left: 50%; bottom: 15em; transform: translateX(-50%); animation: pulse .5s infinite alternate; }
#replay { position: absolute; top: 5em; right: .8em; background: var(--red); padding: .15em .7em; border-radius: .4em; font-size: 1.2em; animation: pulse .5s infinite alternate; pointer-events: none !important; }
#skiprep { position: absolute; inset: 0; background: none; }
@keyframes pulse { to { transform: translateX(-50%) scale(1.07); } }
#replay { transform: none; } @keyframes blink { 50% { opacity: .4; } } #replay { animation: blink .8s infinite; }

/* lance livre: mira e força */
#ftui { position: absolute; inset: 0; } #ftui .t { position: absolute; top: 7.5em; left: 0; right: 0; text-align: center; font-size: 1.4em; }
#ftui .tip { position: absolute; bottom: 7.5em; left: 0; right: 0; text-align: center; font-size: 1.1em; color: var(--yellow); animation: blink 1s infinite; }
.hbar, .vbar { position: absolute; background: #0a0f24; border: .16em solid #fff; border-radius: .5em; overflow: hidden; }
.hbar { left: 14%; right: 14%; bottom: 12.5em; height: 1.9em; } .vbar { right: 1.2em; bottom: 15.5em; width: 1.9em; height: 13em; }
.hbar .z, .vbar .z { position: absolute; background: linear-gradient(#63e06a, #2fb344); } .hbar .z { top: 0; bottom: 0; } .vbar .z { left: 0; right: 0; }
.hbar .m, .vbar .m { position: absolute; background: var(--yellow); box-shadow: 0 0 0 .12em var(--ink); }
.hbar .m { top: -10%; bottom: -10%; width: .45em; margin-left: -.22em; } .vbar .m { left: -10%; right: -10%; height: .45em; margin-top: -.22em; }
.dim { opacity: .35; }
/* barra do treino */
#trainbar { position: absolute; top: max(.6em, env(safe-area-inset-top)); left: .6em; right: .6em; display: flex; align-items: center; gap: .6em; background: rgba(10, 15, 36, .9); border-radius: .6em; padding: .4em .6em; }
#trainbar b { font-weight: 400; color: var(--yellow); font-size: 1.5em; } #trainbar span { flex: 1; font-size: .9em; }

/* ---------- avisos animados ---------- */
#banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none !important; z-index: 6; }
#banner div { display: inline-block; animation: pop 1.9s both; }
#banner h1 { margin: 0; font-weight: 400; font-size: 3.1em; line-height: 1; color: var(--yellow); transform: rotate(-4deg); }
#banner.good h1 { color: #7dff6a; } #banner.bad h1 { color: #ff7a6a; } #banner.info h1 { color: #7fd4ff; } #banner.warn h1 { color: var(--yellow); }
#banner p { margin: .5em 0 0; font-size: 1em; background: rgba(10, 15, 36, .85); display: inline-block; padding: .2em .8em; border-radius: .5em; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 12% { transform: scale(1.25); opacity: 1; } 20% { transform: scale(1); } 85% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
#floats { position: absolute; inset: 0; pointer-events: none !important; overflow: hidden; }
#floats div { position: absolute; transform: translate(-50%, -50%); font-size: 1.35em; animation: rise 1.1s ease-out both; white-space: nowrap; }
#floats .good { color: #7dff6a; } #floats .bad { color: #ff7a6a; } #floats .coin { color: var(--yellow); } #floats .info { color: #7fd4ff; }
@keyframes rise { 0% { opacity: 0; margin-top: .6em; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -3em; } }
#toast { position: absolute; left: 50%; bottom: 7em; transform: translateX(-50%); background: rgba(10, 15, 36, .95); border: .12em solid var(--yellow); border-radius: .6em; padding: .4em .9em; font-size: .95em; opacity: 0; transition: opacity .25s; pointer-events: none !important; z-index: 30; text-align: center; max-width: 86%; }
#toast.on { opacity: 1; }

/* ---------- modal ---------- */
#modal { position: absolute; inset: 0; background: rgba(5, 8, 22, .72); display: grid; place-items: center; z-index: 20; padding: 1em; }
#modal .box { width: 100%; max-height: 88%; display: flex; flex-direction: column; background: linear-gradient(#1f47b8, #152f86); border: .16em solid #5d86ff; border-radius: .9em; box-shadow: 0 .5em 0 #0a1642, 0 1em 2em rgba(0, 0, 0, .5); position: relative; animation: zoom .18s; }
@keyframes zoom { from { transform: scale(.85); opacity: 0; } }
#modal h2 { margin: 0; font-weight: 400; text-align: center; font-size: 1.45em; padding: .5em 2em .35em; }
#modal .body { overflow-y: auto; padding: .3em .8em .9em; touch-action: pan-y; }
#modal .x { position: absolute; right: -.4em; top: -.5em; z-index: 2; }

  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a)),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  // número aleatório com distribuição normal (Box-Muller)
  gauss: () => {
    let u = 0;
    while (!u) u = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.28318 * Math.random());
  },
  dist: (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz),
  // interpolação de ângulo pelo caminho mais curto
  angLerp(a, b, t) {
    const d = ((((b - a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;

  },
  shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];

// tabela de jogos: turno e returno (método do círculo)
function makeSchedule(n) {
  const ids = [...Array(n).keys()], rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const m = [];
    for (let i = 0; i < n / 2; i++) m.push(r % 2 ? [ids[n - 1 - i], ids[i]] : [ids[i], ids[n - 1 - i]]);
    rounds.push(m);
    ids.splice(1, 0, ids.pop());
  }
  return rounds.concat(rounds.map((r) => r.map(([a, b]) => [b, a])));
}

    look: { skin: 0, hair: 1, hairColor: 0, face: 0, shoes: 0, num: 7 },
    owned: { hair: [0, 1], face: [0, 1], shoes: [0, 1] },
    boosters: { coin: 2, slow: 1, aim: 2, nose: 0, rewind: 1 },
    teamId: 0, season: newSeason(1),

}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    S = raw ? Object.assign(defaultSave(), JSON.parse(raw)) : defaultSave();
  } catch (e) { S = defaultSave(); }
  ensureDaily();
  tickEnergy();
}
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* armazenamento indisponível */ }
}

/* ---------- Progressão ---------- */
const xpNeed = (lvl) => 200 + (lvl - 1) * 150;
function addXP(n) {
  S.xp += Math.round(n);
  let up = 0;
  while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; S.gems += 5; up++; }
  return up;
}
const trainNeed = (lvl) => 60 + lvl * 30;
function addTrainXP(n) {
  n = Math.round(n * (1 + lifeBonus('txp')));
  S.training.xp += n;
  let up = 0;
  while (S.training.xp >= trainNeed(S.training.level) && S.training.level < 20) {
    S.training.xp -= trainNeed(S.training.level); S.training.level++; up++;
  }
  return { n, up };
}
const energyMax = () => 10 + lifeBonus('en');
const ENERGY_MS = 6 * 60 * 1000;          // 1 de energia a cada 6 minutos
function tickEnergy() {
  const max = energyMax();
  if (S.energy >= max) { S.energyTs = Date.now(); return; }
  const n = Math.floor((Date.now() - S.energyTs) / ENERGY_MS);
  if (n > 0) { S.energy = Math.min(max, S.energy + n); S.energyTs += n * ENERGY_MS; }
}
const maxTrain = () => 2 + lifeBonus('train');

// tarefas e evento do dia (renovam à meia-noite)
function ensureDaily() {
  const d = U.today();
  if (S.daily && S.daily.day === d) return;
  const tasks = U.shuffle(TASK_POOL.slice()).slice(0, 3).map((t) => ({ id: t.id, prog: 0, done: false }));
  S.daily = { day: d, tasks, event: { id: U.pick(EVENT_POOL).id, prog: 0, done: false }, login: false };
}
function dailyProgress(id, n) {
  if (!n) return;
  ensureDaily();
  S.daily.tasks.forEach((t) => { if (t.id === id) t.prog += n; });
  if (S.daily.event.id === id) S.daily.event.prog += n;
}
function grant(r) {                         // entrega recompensa {coins, gems}
  if (r.coins) S.coins += r.coins;
  if (r.gems) S.gems += r.gems;
}
const rewardTxt = (r) => (r.coins ? `🪙 ${r.coins}` : '') + (r.gems ? ` 💎 ${r.gems}` : '');

/* ---------- Liga: classificação e simulação das outras partidas ---------- */
function standings() {
  return S.season.table.slice().sort((a, b) => b.w - a.w || (b.pf - b.pa) - (a.pf - a.pa) || b.pf - a.pf);
}
const myPos = () => standings().findIndex((t) => t.id === S.teamId) + 1;
const posOf = (id) => standings().findIndex((t) => t.id === id) + 1;
function nextFixture() {
  const se = S.season;
  if (se.round >= se.schedule.length) return null;
  const m = se.schedule[se.round].find((x) => x[0] === S.teamId || x[1] === S.teamId);
  return { home: m[0] === S.teamId, opp: TEAMS[m[0] === S.teamId ? m[1] : m[0]] };
}
function simScore(a, b) {                   // placar simulado entre dois times
  let sa = Math.round(20 + TEAMS[a].stars * 3 + U.gauss() * 5), sb = Math.round(20 + TEAMS[b].stars * 3 + U.gauss() * 5);
  while (sa === sb) { sa += U.randi(0, 5); sb += U.randi(0, 5); }
  return [Math.max(8, sa), Math.max(8, sb)];
}
function applyResult(a, b, sa, sb) {
  const ta = S.season.table.find((t) => t.id === a), tb = S.season.table.find((t) => t.id === b);
  ta.pf += sa; ta.pa += sb; tb.pf += sb; tb.pa += sa;
  if (sa > sb) { ta.w++; tb.l++; } else { tb.w++; ta.l++; }
}
// fecha a rodada: registra o jogo do usuário e simula os demais
function finishRound(myScore, oppScore) {
  const se = S.season;
  se.schedule[se.round].forEach(([a, b]) => {
    if (a === S.teamId) applyResult(a, b, myScore, oppScore);
    else if (b === S.teamId) applyResult(a, b, oppScore, myScore);
    else { const [sa, sb] = simScore(a, b); applyResult(a, b, sa, sb); }
  });
  se.npcs.forEach((n, i) => {               // artilheiros fictícios acumulam números
    const st = TEAMS[n.team].stars;
    n.g++; n.pts += Math.max(0, Math.round((i % 2 ? 5 : 8) + st * 1.2 + U.gauss() * 3));
    n.ast += Math.max(0, Math.round((i % 2 ? 3 : 1.2) + U.gauss() * 1.2));
  });
  se.results.push([myScore, oppScore]);
  se.round++;
}
const seasonOver = () => S.season.round >= S.season.schedule.length;
const natReq = () => ({ pop: S.level >= 6, life: S.lifestyle >= 5, train: S.training.level >= 7 });

/* =====================================================================
   Arquivo 01: áudio — tudo sintetizado com a Web Audio API
   (quique, swish, aro, tabela, apito, buzina, torcida, moedas, música)
   ===================================================================== */
const SND = (() => {
  let ctx = null, master = null, crowdGain = null, crowdFilter = null, noiseBuf = null;
  let musicTimer = null, musicGain = null, step = 0, nextT = 0;

  function init() {                       // chamado no primeiro toque (política de autoplay)
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }

    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    // buffer de ruído (2 s) reutilizado por swish e torcida
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = w * 0.5 + last * 6; }
    // torcida: ruído filtrado contínuo

    bounce: (v) => { tone('sine', 150, 60, 0.13, 0.5 * v); noise(900, 300, 0.05, 0.12 * v, 2); },
    swish: (v) => { noise(4200, 900, 0.38, 0.5 * v, 1.2); },
    rim: (v) => { tone('triangle', 540, 500, 0.3, 0.3 * v); tone('sine', 813, 790, 0.22, 0.18 * v); noise(2000, 1500, 0.05, 0.1 * v, 4); },
    board: (v) => { tone('sine', 190, 90, 0.16, 0.5 * v); noise(600, 300, 0.07, 0.15 * v, 1); },
    whistle: (v) => {
      const t = ctx.currentTime, o = ctx.createOscillator(), l = ctx.createOscillator(), lg = ctx.createGain(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 2350; l.frequency.value = 34; lg.gain.value = 130;
      l.connect(lg); lg.connect(o.frequency);

    buzzer: (v) => { tone('sawtooth', 148, 148, 1.1, 0.22 * v); tone('sawtooth', 152, 152, 1.1, 0.22 * v); tone('square', 74, 74, 1.1, 0.12 * v); },
    click: (v) => { tone('square', 620, 880, 0.06, 0.12 * v); },
    coin: (v) => { tone('square', 988, 988, 0.07, 0.12 * v); tone('square', 1319, 1319, 0.22, 0.12 * v, 0.07); },
    perfect: (v) => { [784, 988, 1175].forEach((f, i) => tone('triangle', f, f, 0.16, 0.2 * v, i * 0.06)); },
    steal: (v) => { noise(1800, 500, 0.12, 0.4 * v, 2); tone('square', 300, 520, 0.09, 0.1 * v); },
    block: (v) => { tone('sine', 120, 50, 0.22, 0.7 * v); noise(1200, 200, 0.14, 0.4 * v, 1); },
    pass: (v) => { noise(1500, 700, 0.09, 0.18 * v, 2); },
    squeak: (v) => { tone('sine', 1900, 2500, 0.07, 0.05 * v); },
    win: (v) => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('square', f, f, 0.2, 0.12 * v, i * 0.13)); },
    lose: (v) => { [392, 349, 311, 262].forEach((f, i) => tone('triangle', f, f, 0.3, 0.2 * v, i * 0.2)); },
    error: (v) => { tone('sawtooth', 200, 120, 0.2, 0.15 * v); },
    levelup: (v) => { [523, 784, 1047, 1568].forEach((f, i) => tone('triangle', f, f, 0.22, 0.2 * v, i * 0.09)); },
  };

  // torcida: nível de fundo + explosão em cestas
  function crowd(level) {
    if (!ctx) return;
    const v = S.settings.sound ? level : 0;

    crowdGain.gain.setTargetAtTime(0.05, t + 0.6, 0.7);
    crowdFilter.frequency.setValueAtTime(700, t);
    crowdFilter.frequency.linearRampToValueAtTime(1500, t + 0.2);
    crowdFilter.frequency.setTargetAtTime(700, t + 0.7, 0.6);
  }

  // música leve do menu: baixo + arpejo em loop (agendado com look-ahead)
  const CH = [[262, 330, 392, 494], [220, 262, 330, 392], [175, 220, 262, 349], [196, 247, 294, 392]];

      if (i % 2 === 1) tone('sine', 6000, 3000, 0.03, 0.04, nextT - ctx.currentTime, musicGain);
      nextT += 0.19; step++;

  }
  function music(onOff) {
    if (!ctx) return;
    const want = onOff && S.settings.music && S.settings.sound;
    musicGain.gain.setTargetAtTime(want ? 1 : 0, ctx.currentTime, 0.3);
    if (want && !musicTimer) { nextT = ctx.currentTime + 0.05; musicTimer = setInterval(schedule, 80); }
    if (!want && musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }
  return { init, play, crowd, cheer, music, get ready() { return !!ctx; } };
})();

  /* ---------- cesta: suporte, tabela transparente, aro e rede animada ---------- */
  function buildHoop(e) {
    const g = new THREE.Group(); scene.add(g);
    // o suporte da cesta de baixo (perto da câmera) é translúcido para não tapar a jogada
    const pad = e > 0 ? new THREE.MeshLambertMaterial({ color: 0x1d3f8f, transparent: true, opacity: 0.28 }) : lam(0x1d3f8f), white = lam(0xffffff);
    box(g, 1.3, 0.5, 1.7, 0, 0.25, e * 15.6, pad, e < 0);
    box(g, 0.32, 3.3, 0.32, 0, 1.9, e * 15.9, pad, e < 0);
    box(g, 0.2, 0.2, 3.1, 0, 3.5, e * 14.4, pad, e < 0);
    const glass = new THREE.Mesh(BOX, new THREE.MeshLambertMaterial({ color: 0xdff3ff, transparent: true, opacity: 0.28 }));
    glass.scale.set(1.8, 1.05, 0.04); glass.position.set(0, 3.425, e * (CT.BOARD_Z + 0.02)); g.add(glass);
    const fz = e * (CT.BOARD_Z - 0.005);
    box(g, 1.8, 0.05, 0.05, 0, 3.95, fz, white, false); box(g, 1.8, 0.05, 0.05, 0, 2.9, fz, white, false);
    box(g, 0.05, 1.05, 0.05, -0.9, 3.425, fz, white, false); box(g, 0.05, 1.05, 0.05, 0.9, 3.425, fz, white, false);
    box(g, 0.59, 0.04, 0.03, 0, 3.5, fz, white, false); box(g, 0.59, 0.04, 0.03, 0, 3.05, fz, white, false);
    box(g, 0.04, 0.45, 0.03, -0.295, 3.275, fz, white, false); box(g, 0.04, 0.45, 0.03, 0.295, 3.275, fz, white, false);
    const orange = lam(0xff5a1f);
    const rimG = new THREE.Group(); rimG.position.set(0, CT.HOOP_Y, e * CT.BOARD_Z); g.add(rimG);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(CT.RIM_R + 0.012, 0.018, 6, 20), orange);
    rim.rotation.x = Math.PI / 2; rim.position.z = -e * (CT.BOARD_Z - CT.HOOP_Z); rim.castShadow = true; rimG.add(rim);
    box(rimG, 0.12, 0.04, 0.16, 0, -0.01, -e * 0.08, orange, false);
    // rede: malha de losangos em LineSegments
    const NS = 12, RR = [0.225, 0.19, 0.155, 0.13], RY = [0, -0.16, -0.31, -0.44], segs = [];
    for (let k = 0; k < 3; k++) for (let i = 0; i < NS; i++) { segs.push([k, i, k + 1, i + 0.5], [k, i, k + 1, i - 0.5]); }
    const pos = new Float32Array(segs.length * 6), geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const net = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xffffff }));
    net.position.set(0, CT.HOOP_Y, e * CT.HOOP_Z); net.frustumCulled = false; g.add(net);
    const h = { e, x: 0, z: e * CT.HOOP_Z, g, rimG, net, sw: { x: 0, z: 0, vx: 0, vz: 0, b: 0, vb: 0 }, shake: 0 };
    h.kick = (vx, vz, pow) => { h.sw.vx += vx * 0.5; h.sw.vz += vz * 0.5; h.sw.vb -= 3.5 * pow; };
    h.update = (dt) => {
      const s = h.sw;                                  // mola amortecida para o balanço e o "estufar"
      s.vx += (-s.x * 90 - s.vx * 5) * dt; s.vz += (-s.z * 90 - s.vz * 5) * dt; s.vb += (-s.b * 160 - s.vb * 7) * dt;
      s.x += s.vx * dt; s.z += s.vz * dt; s.b += s.vb * dt;
      let j = 0;
      const pt = (k, i) => {
        const a = (i / NS) * 6.2832, f = k / 3, r = RR[k] * (1 + (k ? -s.b * 0.5 * f : 0));
        pos[j++] = Math.cos(a) * r + s.x * f * f; pos[j++] = RY[k] * (1 + s.b * 0.35); pos[j++] = Math.sin(a) * r + s.z * f * f;
      };
      for (const sg of segs) { pt(sg[0], sg[1]); pt(sg[2], sg[3]); }
      geo.attributes.position.needsUpdate = true;
      h.shake *= Math.exp(-dt * 6);
      rimG.rotation.x = e * Math.sin(time * 38) * h.shake * 0.12;
    };
    h.update(0);

  }

  /* Animação procedural: mistura suave até a pose-alvo do modo atual.
     modos: idle, run, drib, hold, aim, shoot, def, jump, dunk, lay, lunge, cele, sad, sit */
  const POSE_KEYS = ['aLx', 'aRx', 'aLz', 'aRz', 'lL', 'lR', 'lean', 'by', 'hd'];
  function animate(m, mode, speed, dt, dphase = 0) {
    if (speed > 0.3) m.phase += dt * (3 + speed * 2.1);
    const run = Math.min(1, speed / 4), sw = Math.sin(m.phase) * run, P = m.pose;
    const T = { aLx: sw * 0.8, aRx: -sw * 0.8, aLz: 0.08, aRz: 0.08, lL: -sw * 0.95, lR: sw * 0.95, lean: run * 0.2, by: Math.sin(time * 2 + m.seed) * 0.01, hd: 0 };
    switch (mode) {
      case 'drib': T.aRx = -0.85 + Math.sin(dphase) * 0.4; T.aRz = 0.12; T.lean += 0.1; break;
      case 'hold': T.aLx = T.aRx = -1.15; T.aLz = T.aRz = -0.35; break;
      case 'aim': T.aLx = T.aRx = -2.45; T.aLz = T.aRz = -0.22; T.by = -0.07; T.lean = -0.05; T.lL = T.lR = 0; break;
      case 'shoot': T.aRx = -3.0; T.aLx = -2.3; T.aLz = T.aRz = -0.1; T.lL = T.lR = 0.12; T.lean = -0.05; break;
      case 'def': T.aLx = T.aRx = -0.55; T.aLz = T.aRz = 1.0; T.by = -0.09; T.lean = 0.14; T.lL *= 0.6; T.lR *= 0.6; break;
      case 'jump': T.aLx = T.aRx = -3.05; T.aLz = T.aRz = 0.14; T.lL = T.lR = 0.1; T.lean = 0; break;
      case 'dunk': T.aRx = -3.1; T.aLx = -0.7; T.lL = -1.0; T.lR = 0.55; T.lean = -0.18; break;
      case 'lay': T.aRx = -2.9; T.aLx = -0.4; T.lL = -1.05; T.lR = 0.3; T.lean = 0; break;
      case 'lunge': T.aRx = -1.5; T.aRz = -0.45; T.lean = 0.42; break;
      case 'cele': T.aLx = T.aRx = -2.85 + Math.sin(time * 13 + m.seed) * 0.3; T.aLz = T.aRz = 0.4; T.by = Math.abs(Math.sin(time * 9 + m.seed)) * 0.2; T.lL = T.lR = 0; T.lean = 0; break;
      case 'sad': T.hd = 0.4; T.lean = 0.12; T.aLx = T.aRx = 0; break;
      case 'sit': T.lL = T.lR = -1.5; T.aLx = T.aRx = -0.6; T.by = -0.34; T.lean = 0; break;
      case 'hips': T.aLx = T.aRx = 0.25; T.aLz = T.aRz = 0.55; break;
    }

    for (const key of POSE_KEYS) P[key] += (T[key] - P[key]) * k;
    applyPose(m);
  }

    m.body.rotation.x = P.lean; m.head.rotation.x = P.hd; m.inner.position.y = P.by;
  }

   Arquivo 03: física da bola e motor da partida 5x5
   - Phys: gravidade, quique, colisão com aro e tabela, detecção de cesta

     fora, faltas, bônus, lances livres, tempos técnicos, prorrogação),

/* ---------------- Física da bola ---------------- */
const Phys = {
  // calcula a velocidade para sair de (x0,y0,z0) e passar por (tx,ty,tz) com ângulo th
  launch(B, x0, y0, z0, tx, ty, tz, th) {
    const dx = tx - x0, dz = tz - z0, d = Math.hypot(dx, dz) || 0.01, dh = ty - y0;
    while (d * Math.tan(th) - dh < 0.2 && th < 1.45) th += 0.04;
    const c = Math.cos(th), v = Math.sqrt((CT.G * d * d) / (2 * c * c * (d * Math.tan(th) - dh)));
    B.x = x0; B.y = y0; B.z = z0;
    B.vx = (dx / d) * v * c; B.vz = (dz / d) * v * c; B.vy = v * Math.sin(th);
  },
  // avança a bola; preenche ev = {floor, rim, board, score}
  step(B, dt, ev) {
    const N = 4, h = dt / N, BR = CT.BALL_R;
    for (let i = 0; i < N; i++) {
      const py = B.y;
      B.vy -= CT.G * h; B.x += B.vx * h; B.y += B.vy * h; B.z += B.vz * h;
      if (B.y < BR) {                                   // piso
        B.y = BR;
        if (B.vy < 0) {
          if (B.vy < -1.3) ev.floor = Math.min(1, -B.vy / 6);
          B.vy = -B.vy * 0.68; B.vx *= 0.88; B.vz *= 0.88;
          if (B.vy < 0.7) B.vy = 0;
        }
      }
      for (let k = 0; k < 2; k++) {
        const e = k ? 1 : -1, zc = e * B.z, cz = e * CT.HOOP_Z;
        if (zc < 9) continue;
        // tabela (1,80 x 1,05 m)
        if (Math.abs(B.x) < 0.94 && B.y > 2.86 && B.y < 3.99 && zc > CT.BOARD_Z - BR && zc < CT.BOARD_Z + 0.08 && e * B.vz > 0) {
          B.z = e * (CT.BOARD_Z - BR); B.vz = -B.vz * 0.6; B.vx *= 0.9; ev.board = true;
        }
        // aro: ponto mais próximo no círculo
        const dxr = B.x, dzr = B.z - cz, rh = Math.hypot(dxr, dzr);
        if (rh > 1e-4 && Math.abs(B.y - CT.HOOP_Y) < BR + 0.03) {
          const px = (dxr / rh) * CT.RIM_R, pz = cz + (dzr / rh) * CT.RIM_R;
          let nx = B.x - px, ny = B.y - CT.HOOP_Y, nz = B.z - pz;
          const dl = Math.hypot(nx, ny, nz), minD = BR + 0.012;
          if (dl < minD && dl > 1e-5) {
            nx /= dl; ny /= dl; nz /= dl;
            const vn = B.vx * nx + B.vy * ny + B.vz * nz;
            if (vn < 0) { B.vx -= 1.52 * vn * nx; B.vy -= 1.52 * vn * ny; B.vz -= 1.52 * vn * nz; ev.rim = Math.min(1, -vn / 4); }
            B.x = px + nx * minD; B.y = CT.HOOP_Y + ny * minD; B.z = pz + nz * minD;
          }

        if (py > CT.HOOP_Y && B.y <= CT.HOOP_Y && B.vy < 0 && Math.hypot(B.x, B.z - cz) < CT.RIM_R) ev.score = k;
      }
    }
  },
};

  };
})();

/* =====================================================================
   Arquivo 04: entrada — toque (Pointer Events), mouse e teclado
   - direcional virtual: toque na metade inferior esquerda
   - mira do arremesso: arrastar para trás a partir do jogador ou do botão
   - toque simples num companheiro: passe
   Teclado (PC): WASD/setas movem · Espaço arremessa/pula · E passa ·
   Q dribla/rouba · F bandeja/enterrada
   ===================================================================== */
const Input = (() => {
  const joy = { x: 0, y: 0, id: -1, ox: 0, oy: 0 };
  const aim = { id: -1, sx: 0, sy: 0, key: false, t: 0 };
  const keys = {}, tap = { id: -1, x: 0, y: 0, t: 0 };
  let layer = null, base = null, knob = null, H = null;      // H = handler do modo atual

  const rect = () => layer.getBoundingClientRect();
  function init(el) {
    layer = el; base = U.$('#stick'); knob = U.$('#knob');
    el.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    window.addEventListener('keydown', (e) => key(e, true)); window.addEventListener('keyup', (e) => key(e, false));
    window.addEventListener('blur', reset);
  }
  function reset() { joy.id = -1; joy.x = joy.y = 0; aim.id = -1; aim.key = false; for (const k in keys) keys[k] = false; if (base) base.style.display = 'none'; }
  function setHandler(h) { reset(); H = h; }

  function down(e) {
    if (!H) return;
    SND.init(); e.preventDefault();
    const r = rect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const o = H.origin && H.origin();
    if (aim.id < 0 && o && Math.hypot(o.x - x, o.y - y) < 64 && H.aimStart()) { aim.id = e.pointerId; aim.sx = x; aim.sy = y; return; }
    if (joy.id < 0 && H.joy !== false && y > r.height * 0.4 && x < r.width * 0.62) {
      joy.id = e.pointerId; joy.ox = x; joy.oy = y; joy.x = joy.y = 0;
      base.style.display = 'block'; base.style.left = x + 'px'; base.style.top = y + 'px'; knob.style.transform = 'translate(-50%,-50%)';
      return;
    }
    tap.id = e.pointerId; tap.x = x; tap.y = y; tap.t = performance.now();
  }
  function move(e) {
    if (!H) return;
    const r = rect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (e.pointerId === joy.id) {
      const R = Math.min(56, r.width * 0.15); let dx = x - joy.ox, dy = y - joy.oy; const l = Math.hypot(dx, dy);
      if (l > R) { dx *= R / l; dy *= R / l; }
      joy.x = dx / R; joy.y = dy / R;
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    } else if (e.pointerId === aim.id) {
      const L = Math.min(r.height * 0.2, 190);
      // estilingue: puxar para baixo dá força; puxar para o lado inverte a direção
      H.aimMove((y - aim.sy) / L, (-(x - aim.sx) / L) * 0.9);
    }
  }
  function up(e) {
    if (!H) return;
    if (e.pointerId === joy.id) { joy.id = -1; joy.x = joy.y = 0; base.style.display = 'none'; }
    else if (e.pointerId === aim.id) { aim.id = -1; H.aimEnd(e.type === 'pointercancel'); }
    else if (e.pointerId === tap.id) {
      tap.id = -1; const r = rect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (performance.now() - tap.t < 350 && Math.hypot(x - tap.x, y - tap.y) < 14 && H.tap) H.tap(x, y);
    }
  }
  // o botão "Arremessar" inicia a mira com o mesmo dedo
  function aimFromButton(e) {
    if (!H || aim.id >= 0 || !H.aimStart()) return;
    const r = rect(); aim.id = e.pointerId; aim.sx = e.clientX - r.left; aim.sy = e.clientY - r.top;
  }
  function key(e, on) {
    if (!H) return;
    const c = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(c)) e.preventDefault();
    if (keys[c] === on) return; keys[c] = on;
    if (joy.id < 0) {
      joy.x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
      joy.y = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
      const l = Math.hypot(joy.x, joy.y); if (l > 1) { joy.x /= l; joy.y /= l; }
    }
    if (c === 'Space') {
      if (on) { if (aim.id < 0 && H.aimStart()) { aim.key = true; aim.t = 0; } else if (H.key) H.key('jump'); }
      else if (aim.key) { aim.key = false; H.aimEnd(false); }
    } else if (on && H.key) {
      if (c === 'KeyE') H.key('pass'); else if (c === 'KeyQ') H.key('q'); else if (c === 'KeyF') H.key('layup');
    }
  }
  function update(dt) {                    // teclado: segurar Espaço carrega a força
    if (aim.key && H) { aim.t += dt; H.aimMove(Math.min(1.3, aim.t / 0.85), 0); }
    if (aim.id >= 0 && H && H.aiming && !H.aiming()) aim.id = -1;
    if (aim.key && H && H.aiming && !H.aiming()) aim.key = false;
  }
  return { init, joy, setHandler, aimFromButton, update, reset };
})();

/* =====================================================================
   Arquivo 05: treinos (minigames)
   - three: 5 posições x 3 bolas atrás da linha de 3, contra o relógio
   - ft:    10 lances livres com mira e barra de força
   - cones: slalom de drible entre cones, contra o relógio
   Reaproveita a física (Phys), a mira (aimViz) e os bonecos (GFX).
   ===================================================================== */
const Train = (() => {
  const T = {}, B = { x: 0, y: 1, z: 0, vx: 0, vy: 0, vz: 0 };
  let model = null, done = null, cones = [];
  const HZ = -CT.HOOP_Z;
  const INFO = {
    three: { name: 'ARREMESSO DE 3', ic: '🎯', desc: '5 posições, 3 bolas em cada. A última de cada posição vale 2!', stars: [6, 11, 15] },
    ft: { name: 'LANCES LIVRES', ic: '🏀', desc: '10 lances livres. Pare a mira e a força na zona verde.', stars: [4, 6, 8] },
    cones: { name: 'DRIBLE ENTRE CONES', ic: '🚧', desc: 'Contorne os cones alternando os lados o mais rápido possível.', stars: [12, 9.5, 7.5] },
  };

  function start(kind, cb) {
    done = cb;
    Object.assign(T, { kind, on: true, t: 0, score: 0, st: 'ready', stT: 0, x: 0, z: 0, y: 0, vx: 0, vz: 0, rot: Math.PI, dph: 0, aim: { on: false, p: 0, dev: 0 }, msg: '', shot: 0, made: false, spot: 0, ball: 0, time: 45, gate: 0, pen: 0, ftIn: null, sh: false });
    GFX.disposeModel(model);
    const t = TEAMS[S.teamId];
    model = GFX.makeModel(Object.assign({}, S.look, { c1: t.c1, c2: t.c2 }));
    GFX.paintCourt(t.c1, t.c2); GFX.setCones([]); cones = [];
    if (kind === 'three') placeSpot();
    else if (kind === 'ft') { T.x = 0; T.z = -(CT.HL - CT.FT_D - 0.25); HUD.ftShow(true, 1, 10); }
    else {
      const list = []; for (let i = 0; i < 9; i++) list.push([0, 7 - i * 2]);
      cones = GFX.setCones(list).map((m, i) => ({ m, x: 0, z: list[i][1], hit: false }));
      T.x = 0.9; T.z = 9.2; T.st = 'run';
    }
    GFX.star.visible = false;
    Input.setHandler({
      joy: kind === 'cones',
      origin: () => (kind === 'three' ? GFX.project(T.x, 1, T.z) : null),
      aimStart: () => { if (kind !== 'three' || T.st !== 'ready') return false; T.st = 'aim'; T.aim = { on: true, p: 0, dev: 0 }; return true; },
      aimMove: (p, d) => { T.aim.p = U.clamp(p, 0, 1.4); T.aim.dev = U.clamp(d, -0.6, 0.6); },
      aimEnd: (cancel) => { if (T.st === 'aim') { T.aim.on = false; if (cancel || T.aim.p < 0.3) T.st = 'ready'; else shoot3(); } },
      aiming: () => T.st === 'aim',
    });
  }
  function placeSpot() {
    const a = [-1.31, -0.66, 0, 0.66, 1.31][T.spot];
    T.x = Math.sin(a) * 7.15; T.z = HZ + Math.cos(a) * 7.15; T.rot = Math.atan2(-T.x, HZ - T.z);
  }
  const hand = () => ({ x: T.x + Math.sin(T.rot) * 0.24, y: T.y + 2.28, z: T.z + Math.cos(T.rot) * 0.24 });
  const skill = () => Math.min(0.95, 0.58 + S.training.level * 0.019);

  function launch(long, lat, th) {
    const hp = hand(); let ux = -hp.x, uz = HZ - hp.z; const l = Math.hypot(ux, uz); ux /= l; uz /= l;
    Phys.launch(B, hp.x, hp.y, hp.z, ux * long - uz * lat, CT.HOOP_Y, HZ + uz * long + ux * lat, th);
    T.st = 'fly'; T.stT = 0; T.made = false; T.sh = true; SND.play('pass', 0.6);
  }
  function shoot3() {
    const a = T.aim, d = U.dist(T.x, T.z, 0, HZ), E = aimErr(a, d);
    if (E.perfect) { SND.play('perfect'); HUD.float(T.x, 2.7, T.z, 'PERFEITO!', 'good'); }
    const sg = (0.022 + 0.0045 * d) * (1.4 - 0.62 * skill());
    launch(E.long + U.gauss() * sg, E.lat + U.gauss() * sg * 0.8, (U.clamp(62 - d * 1.9, 47, 62) * Math.PI) / 180);
  }
  function ftInput(aim, pow) {
    if (T.kind !== 'ft' || T.st !== 'ready') return;
    const gz = ftZone(), sc = (e) => (Math.abs(e) < gz ? e * 0.1 : e);
    if (Math.abs(aim) < gz && Math.abs(pow) < gz) HUD.float(T.x, 2.6, T.z, 'PERFEITO!', 'good');
    launch(sc(pow) * 0.5 + U.gauss() * 0.03, sc(aim) * 0.34 + U.gauss() * 0.025, 0.93);
    HUD.ftShow(false);
  }
  function finish() {
    if (!T.on) return; T.on = false; HUD.ftShow(false);
    const I = INFO[T.kind]; let val = T.score, stars;
    if (T.kind === 'cones') { val = T.t + T.pen; stars = I.stars.filter((s) => val <= s).length; }
    else stars = I.stars.filter((s) => val >= s).length;
    SND.play(stars ? 'win' : 'lose');
    if (done) done({ kind: T.kind, val, stars });
  }

  function update(dt) {
    if (!T.on) return;
    T.stT += dt;
    const fl = []; let mode = 'idle', speed = 0;
    if (T.kind === 'cones') {
      // drible: direcional move o jogador; passar pelo lado errado ou derrubar o cone penaliza
      T.t += dt;
      const j = Input.joy, sp = 5.7 + S.training.level * 0.03;
      let ax = j.x * sp - T.vx, az = j.y * sp - T.vz; const al = Math.hypot(ax, az), ma = 24 * dt;
      if (al > ma) { ax *= ma / al; az *= ma / al; }
      T.vx += ax; T.vz += az; const pz = T.z; T.x = U.clamp(T.x + T.vx * dt, -5, 5); T.z = U.clamp(T.z + T.vz * dt, -13, 13);
      speed = Math.hypot(T.vx, T.vz); if (speed > 0.6) T.rot = U.angLerp(T.rot, Math.atan2(T.vx, T.vz), 0.25);
      mode = 'drib'; const a = T.dph; T.dph += dt * 12.5; if (Math.floor(a / Math.PI) !== Math.floor(T.dph / Math.PI)) SND.play('bounce', 0.4);
      for (let i = 0; i < cones.length; i++) {
        const c = cones[i], side = i % 2 ? 1 : -1;
        if (!c.hit && U.dist(T.x, T.z, c.x, c.z) < 0.45) { c.hit = true; c.m.rotation.z = 1.5; c.m.position.y = 0.12; T.pen += 1; SND.play('error'); HUD.float(c.x, 1, c.z, '+1s', 'bad'); }
        if (i === T.gate && pz > c.z && T.z <= c.z) {
          if (T.x * side > 0.15) { SND.play('click'); HUD.float(c.x, 1.2, c.z, '✔', 'good'); } else { T.pen += 2; SND.play('error'); HUD.float(c.x, 1.2, c.z, 'LADO ERRADO +2s', 'bad'); }
          T.gate++;
        }
      }
      if (T.gate < cones.length) { const c = cones[T.gate], side = T.gate % 2 ? 1 : -1; GFX.setRing(GFX.passRing, true, c.x + side * 1.0, c.z, 1.2); } else GFX.setRing(GFX.passRing, false);
      for (let x = -3; x <= 3; x += 0.5) fl.push([x, 0.04, -10.5, 1.3]);
      B.x = T.x + Math.sin(T.rot) * 0.42 - Math.cos(T.rot) * 0.3; B.z = T.z + Math.cos(T.rot) * 0.42 + Math.sin(T.rot) * 0.3; B.y = 0.14 + Math.abs(Math.sin(T.dph)) * 0.78;
      if (T.z < -10.5 && T.gate >= cones.length) finish();
      else if (T.t > 40) finish();
      T.msg = `⏱ ${(T.t + T.pen).toFixed(1)}s`;
      GFX.cam(T.x * 0.6, 11, T.z + 9.5, T.x * 0.6, 0.6, T.z - 2.5, 1 - Math.exp(-dt * 4));
    } else {
      if (T.kind === 'three' && T.st !== 'done') { T.time -= dt; if (T.time <= 0 && T.st !== 'fly') return finish(); }
      if (T.st === 'ready' || T.st === 'aim') {
        mode = T.st === 'aim' || T.kind === 'ft' ? 'aim' : 'hold'; T.y = 0;
        const hp = T.st === 'aim' || T.kind === 'ft' ? hand() : { x: T.x + Math.sin(T.rot) * 0.36, y: 1.2, z: T.z + Math.cos(T.rot) * 0.36 };
        B.x = hp.x; B.y = hp.y; B.z = hp.z; B.vx = B.vy = B.vz = 0;
        if (T.st === 'aim') { const r = aimViz(T.x, T.z, hand(), T.aim, S.training.level >= 5, fl); HUD.aimLabel(true, r.x, r.y, Math.round(T.aim.p * 100), r.good, true); }
      } else if (T.st === 'fly') {
        mode = T.stT < 0.4 ? 'shoot' : 'idle'; T.y = T.stT < 0.5 ? 4 * 0.45 * (T.stT / 0.5) * (1 - T.stT / 0.5) : 0;
        const ev = {}; Phys.step(B, dt, ev);
        if (ev.floor) SND.play('bounce', ev.floor); if (ev.rim) { SND.play('rim', ev.rim); GFX.hoops[0].shake = 0.4; } if (ev.board) SND.play('board');
        if (ev.score === 0 && !T.made) {
          T.made = true; const gold = T.kind === 'three' && T.ball === 2;
          T.score += gold ? 2 : 1; SND.play('swish'); GFX.hoops[0].kick(B.vx, B.vz, 1); GFX.hypeUp(0.5);
          GFX.burst(0, CT.HOOP_Y - 0.3, HZ, [0xffd400, 0xffffff, 0xff7a1a], 20, 4);
          HUD.float(0, CT.HOOP_Y + 0.7, HZ, gold ? '+2' : '+1', 'good'); B.vx *= 0.3; B.vz *= 0.3;
        }
        if ((T.made && T.stT > 0.9 && B.y < 2.2) || (B.y < 1 && T.stT > 0.7) || T.stT > 3) {       // próxima bola
          T.shot++; T.st = 'ready'; T.stT = 0;
          if (T.kind === 'three') { T.ball++; if (T.ball > 2) { T.ball = 0; T.spot++; if (T.spot > 4) return finish(); placeSpot(); } if (T.time <= 0) return finish(); }
          else { if (T.shot >= 10) return finish(); HUD.ftShow(true, T.shot + 1, 10); }
        }
      }
      if (T.st !== 'aim') { GFX.setArrow(false); GFX.traj([]); HUD.aimLabel(false); }
      T.msg = T.kind === 'three' ? `⏱ ${Math.max(0, T.time).toFixed(0)}s · bola ${Math.min(15, T.spot * 3 + T.ball + 1)}/15` : `Lance ${Math.min(10, T.shot + 1)}/10`;
      if (T.kind === 'ft') GFX.cam(T.x, 4.3, T.z + 5.2, 0, 2.7, HZ, 1 - Math.exp(-dt * 4));
      else {                                           // câmera atrás do arremessador, olhando para a cesta
        const dx = T.x, dz = T.z - HZ, l = Math.hypot(dx, dz) || 1;
        GFX.cam(U.clamp(T.x + (dx / l) * 6, -8.8, 8.8), 6.2, T.z + (dz / l) * 6, T.x * 0.45, 2.1, (T.z + HZ) / 2, 1 - Math.exp(-dt * 4));
      }
      GFX.setRing(GFX.passRing, false);
    }
    GFX.floor(fl);
    GFX.animate(model, mode, speed, dt, T.dph);
    model.g.position.set(T.x, T.y, T.z); model.g.rotation.y = T.rot;
    GFX.setRing(GFX.userRing, true, T.x, T.z);
    const bm = GFX.ball; bm.position.set(B.x, B.y, B.z); bm.rotation.x += dt * 5;
  }
  function stop() {
    T.on = false; GFX.disposeModel(model); model = null; GFX.setCones([]); cones = [];
    GFX.setArrow(false); GFX.traj([]); GFX.floor([]); GFX.setRing(GFX.userRing, false); GFX.setRing(GFX.passRing, false);
    HUD.ftShow(false); HUD.aimLabel(false);
  }
  return { start, update, stop, ftInput, finish, INFO, get state() { return T; } };
})();

/* =====================================================================
   Arquivo 06: interface HTML
   - HUD: placar, relógios, botões de ação, avisos animados, lance livre
   - UI: menus do modo carreira (início, loja, partidas, eventos, estilo
     de vida), pré-jogo, resultado e janelas (modais)
   ===================================================================== */
const HUD = (() => {
  const $ = U.$, el = {}, cache = {};
  let toastT = 0, aimOn = false, joyUsed = false;
  const ft = { on: false, stage: 0, t: 0, aim: 0, pow: 0 };
  const set = (id, v) => { if (cache[id] !== v) { cache[id] = v; el[id].textContent = v; } };
  const vis = (id, on) => { const k = 'v_' + id; if (cache[k] !== on) { cache[k] = on; el[id].classList.toggle('hidden', !on); } };
  const cls = (id, c) => { const k = 'c_' + id; if (cache[k] !== c) { cache[k] = c; el[id].className = c; } };

  function init() {
    ['sb', 'sb-a', 'sb-b', 'sb-sc', 'sb-q', 'sb-clk', 'sb-sh', 'sb-f', 'mystats', 'goals', 'hint', 'aimlbl', 'b-shoot', 'b-pass', 'b-drib', 'b-lay', 'b-steal', 'b-jump',
      'btn-rew', 'replay', 'skiprep', 'ftui', 'ft-t', 'ft-aim', 'ft-pow', 'ft-tip', 'btn-pause', 'trainbar', 'tr-score', 'tr-msg', 'tr-quit', 'joyhint', 'banner', 'floats', 'toast', 'hud'].forEach((id) => { el[id] = $('#' + id); });
    const press = (id, fn) => el[id].addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); SND.init(); fn(e); });
    press('b-shoot', (e) => Input.aimFromButton(e));
    press('b-pass', () => Match.act('pass')); press('b-drib', () => Match.act('dribble')); press('b-lay', () => Match.act('layup'));
    press('b-steal', () => Match.act('steal')); press('b-jump', () => Match.act('jump'));
    press('btn-rew', () => Match.rewind()); press('skiprep', () => Match.endReplay());
    press('btn-pause', () => UI.pauseMenu()); press('tr-quit', () => Game.quitTraining());
    press('ftui', ftTap);
  }

  /* ----- avisos ----- */
  function banner(txt, sub, kind = 'warn') {
    el.banner.className = kind;
    el.banner.innerHTML = `<div><h1 class="out">${txt}</h1>${sub ? `<br><p>${sub}</p>` : ''}</div>`;
  }
  function float(x, y, z, txt, c = 'good') {
    const p = GFX.project(x, y, z), d = document.createElement('div');
    d.className = 'out ' + c; d.textContent = txt; d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    el.floats.appendChild(d); setTimeout(() => d.remove(), 1100);
  }
  function toast(msg) { el.toast.textContent = msg; el.toast.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.toast.classList.remove('on'), 2000); }
  function aimLabel(on, x, y, pct, good, three) {
    if (!on) { if (aimOn) { aimOn = false; el.aimlbl.classList.add('hidden'); } return; }
    aimOn = true; const a = el.aimlbl;
    a.className = 'out' + (good ? ' good' : ''); a.style.left = x + 'px'; a.style.top = y + 'px';
    a.textContent = (good ? 'PERFEITO ' : '') + pct + '%' + (three ? ' ·3' : '');
  }
  function replay(on) { vis('replay', on); vis('skiprep', on); }
  function period(q, sc) {
    const c = Match.cfg, tied = sc[0] === sc[1], s = Match.view().stats;
    const title = q >= 4 ? 'PRORROGAÇÃO!' : q === 2 ? 'INTERVALO' : `FIM DO ${q}º QUARTO`;
    UI.modal(title, `<div class="center" style="font-size:1.9em">${c.t0.short} ${sc[0]} : ${sc[1]} ${c.t1.short}</div>
      <div class="kv"><div><small>Pontos</small><b>${s.pts}</b></div><div><small>Assist.</small><b>${s.ast}</b></div><div><small>Rebotes</small><b>${s.reb}</b></div><div><small>Faltas</small><b>${s.fouls}</b></div></div>
      <p class="txt center">${q >= 4 && tied ? 'Empate! Vamos para o tempo extra.' : q === 2 ? 'Cada time recebe 3 tempos técnicos no 2º tempo.' : 'As faltas coletivas foram zeradas.'}</p>
      <button class="btn y big" data-a="nextPeriod">CONTINUAR</button>`, { noX: true });
  }
  function fouledOut(wasUser, subName) {
    if (!wasUser) return toast(`Substituição: entra ${subName}`);
    Match.pause(true);
    UI.modal('ELIMINADO!', `<p class="txt center">Você cometeu <b>5 faltas</b> e está fora da partida.<br>${subName} entra no seu lugar.</p>
      <div class="row"><button class="btn d grow" data-a="watch">Assistir</button><button class="btn y grow" data-a="simEnd">Simular o fim</button></div>`, { noX: true });
  }

  /* ----- lance livre: duas barras (mira e força) ----- */
  function ftShow(on, i, n) {
    if (!on) { if (ft.on) { ft.on = false; vis('ftui', false); } return; }

  function settingsModal(inMatch) {

      <div class="row"><button class="btn grow" data-a="howto">❓ Como jogar</button>${inMatch ? '' : '<button class="btn r sm" data-a="reset">Apagar progresso</button>'}</div>`, { onClose: inMatch ? () => pauseMenu() : null });
  }
  function howtoModal() {
    modal('COMO JOGAR', `<div class="txt">
      <p>🕹️ <b>Mover:</b> arraste o dedo na parte de baixo/esquerda da tela (PC: WASD ou setas).</p>
      <p>🏀 <b>Arremessar:</b> segure o botão amarelo (ou o seu jogador) e <b>arraste para trás</b>. A seta mostra a força: solte perto de <b>100%</b> e mantenha a seta reta. O arco pontilhado mostra a trajetória. (PC: segure Espaço.)</p>
      <p>🤝 <b>Passar:</b> toque no companheiro ou use PASSAR (a linha pontilhada mostra o alvo). Sem a bola, PEDIR BOLA chama o passe. (PC: E)</p>
      <p>⚡ <b>Driblar:</b> arranque para desequilibrar o marcador. Se você segurar a bola (finta de arremesso), não pode driblar de novo: é <b>drible duplo</b>; e andar com ela é <b>andada</b>. (PC: Q)</p>
      <p>💥 <b>Enterrar/Bandeja:</b> aparece perto da cesta. (PC: F)</p>
      <p>🛡️ <b>Defesa:</b> marque o jogador do anel vermelho. ROUBAR perto da bola; BLOQUEAR no tempo do arremesso. Errar o tempo pode dar falta — com 5 você é eliminado.</p>
      <p>📏 <b>Regras:</b> 24s de posse (14 após rebote de ataque), 8s para passar do meio, sem volta de quadra, 3s no garrafão, bônus de lances livres após 4 faltas coletivas no quarto, prorrogação em caso de empate.</p></div>
      <button class="btn y big" data-a="close">ENTENDI!</button>`, { onClose: () => { if (!S.tutorial) { S.tutorial = true; saveGame(); } if (Game.mode === 'match' && Match.state.paused) pauseMenu(); } });
  }
  function pauseMenu() {
    if (Game.mode !== 'match' || Match.view().ended) return;
    Match.pause(true);
    const v = Match.view();
    modal('PAUSA', `<div class="center" style="font-size:1.5em">${Match.cfg.t0.short} ${v.score[0]} : ${v.score[1]} ${Match.cfg.t1.short}</div>
      <div class="kv"><div><small>Pontos</small><b>${v.stats.pts}</b></div><div><small>Assist.</small><b>${v.stats.ast}</b></div><div><small>Rebotes</small><b>${v.stats.reb}</b></div><div><small>Faltas</small><b>${v.fouls}/5</b></div></div>
      <button class="btn y big" data-a="resume">CONTINUAR</button>
      <div class="row mt"><button class="btn grow" data-a="timeout">⏱️ Tempo técnico (${v.to[0]})</button><button class="btn d" data-a="settingsM">⚙️</button></div>
      <div class="row"><button class="btn d grow" data-a="howto">❓ Como jogar</button><button class="btn r" data-a="quit">Desistir</button></div>`, { noX: true });
  }

  /* ----- pré-jogo ----- */
  function openPre(kind) {
    tickEnergy();
    let opp, my;
    if (kind === 'league') { const fx = nextFixture(); if (!fx) return seasonEnd(); opp = fx.opp; my = team(); }
    else { opp = NATIONS[S.national.played % NATIONS.length]; my = BRAZIL; }
    const goals = [{ id: 'win', txt: 'Vitória', short: 'Vitória', stat: 'win', goal: 1, coins: 150 }].concat(U.shuffle(GOAL_POOL.slice()).slice(0, 2));
    PRE = { kind, opp, my, goals, boost: {}, cost: kind === 'league' ? 1 : 2 };
    hideMenus(); $('#top').classList.remove('hidden'); $('#pre').classList.remove('hidden');
    Game.stage('pre', opp, my); renderPre();
  }
  function renderPre() {
    refreshTop();
    const p = PRE, se = S.season, act = Object.keys(p.boost);
    $('#pre').innerHTML = `
      <div class="hd out">${p.kind === 'league' ? `LIGA CUBO · RODADA ${se.round + 1}/${se.schedule.length}` : 'AMISTOSO DE SELEÇÕES'}</div>
      <div class="vs"><div><h3 class="out">${p.my.name.toUpperCase()}</h3>${stars(p.my.stars)}${p.kind === 'league' ? `<span class="pos">${myPos()}º</span>` : ''}</div><em class="out">VS</em>
        <div><h3 class="out">${p.opp.name.toUpperCase()}</h3>${stars(p.opp.stars)}${p.kind === 'league' ? `<span class="pos">${posOf(p.opp.id)}º</span>` : ''}</div></div>
      <div class="bot">
        <div class="goalbox"><span class="yel">METAS DA PARTIDA</span>${p.goals.map((g) => `<div class="g"><span>◆ ${g.txt}</span><span>🪙 ${g.coins}</span></div>`).join('')}</div>
        <div class="slots">${[0, 1, 2].map((i) => `<button class="slot ${act[i] ? 'on' : ''}" data-a="boosts">${act[i] ? BOOST[act[i]].ic : '➕'}</button>`).join('')}<span class="txt out" style="font-size:.8em">Toque para ativar<br>melhorias</span></div>
        <div class="row"><button class="btn" data-a="back">◀ Voltar</button><button class="btn y grow" style="font-size:1.35em" data-a="go">BOLA AO ALTO ⚡${p.cost}</button></div>
      </div>`;
  }
  function boostsModal() {
    const p = PRE;
    modal('MELHORIAS', Object.keys(BOOST).map((k) => {
      const b = BOOST[k], on = p.boost[k];
      return `<div class="item"><span class="ic2">${b.ic}</span><div class="grow"><h4>${b.name}</h4><small>${b.desc}</small></div><span class="cnt">${S.boosters[k]}</span>
        <button class="btn y sm" data-a="buyBoost:${k}">🪙${b.cost}</button><button class="btn ${on ? 'r' : 'g'} sm" data-a="useBoost:${k}" ${S.boosters[k] > 0 || on ? '' : 'disabled'}>${on ? 'Tirar' : 'Usar'}</button></div>`;
    }).join('') + '<p class="txt center">Até 3 melhorias por partida. Elas são consumidas ao começar o jogo.</p>', { onClose: () => { if (PRE) renderPre(); } });
  }
  function go() {
    const p = PRE; tickEnergy();
    if (S.energy < p.cost) { SND.play('error'); return HUD.toast('Sem energia! Espere recarregar ou use gemas na Loja.'); }
    if (S.energy >= energyMax()) S.energyTs = Date.now();
    S.energy -= p.cost; Object.keys(p.boost).forEach((k) => { S.boosters[k]--; });
    saveGame(); hideMenus();
    Game.startMatch({ t0: p.my, t1: p.opp, userLook: S.look, tlvl: S.training.level, qlen: S.settings.qlen, boost: p.boost, goals: p.goals }, p.kind);
    if (!S.tutorial) howtoModal();
  }

  /* ----- fim de partida: recompensas e progresso da carreira ----- */
  function result(res, kind) {
    const s = res.user, c = Match.cfg, def = s.stl + s.blk;
    let coins = 60 + s.pts * 4 + (res.win ? 120 : 0) + res.coins;
    res.goals.forEach((g) => { if (g.done) coins += g.g.coins; });
    coins = Math.round(coins * (1 + lifeBonus('coin')));
    const xp = 40 + (res.win ? 70 + lifeBonus('pop') : 15) + Math.round(res.rating * 6) + (kind === 'national' ? 40 : 0);
    S.coins += coins; const ups = addXP(xp);
    const ca = S.career; ca.g++; ca.pts += s.pts; ca.ast += s.ast; ca.reb += s.reb; ca.tpm += s.tpm; ca.dunk += s.dunks; ca.def += def; ca.rate += res.rating; if (res.win) ca.wins++;
    if (kind === 'league') { const my = S.season.my; my.g++; my.pts += s.pts; my.ast += s.ast; my.reb += s.reb; my.tpm += s.tpm; my.rate += res.rating; finishRound(res.score[0], res.score[1]); }
    else { S.national.played++; if (res.win) { S.national.wins++; S.gems += 8; } }
    dailyProgress('play', 1); dailyProgress('pts', s.pts); dailyProgress('three', s.tpm); dailyProgress('ast', s.ast); dailyProgress('def', def); if (res.win) dailyProgress('win', 1);
    S.trainLeft = maxTrain();
    const r = natReq(); let called = false;
    if (!S.national.called && r.pop && r.life && r.train) { S.national.called = true; called = true; }
    saveGame();
    const el = $('#result'); el.classList.remove('hidden');
    el.innerHTML = `<h1 class="out">${res.win ? 'VITÓRIA!' : 'DERROTA'}</h1>
      <div class="sc out">${c.t0.short} ${res.score[0]} : ${res.score[1]} ${c.t1.short}${res.ot ? ' <small>(prorr.)</small>' : ''}</div>
      <div class="blk"><div class="kv"><div><small>Nota</small><b class="yel">${res.rating.toFixed(1)}</b></div><div><small>Pontos</small><b>${s.pts}</b></div><div><small>Assist.</small><b>${s.ast}</b></div><div><small>Rebotes</small><b>${s.reb}</b></div></div>
        <p class="center">Arremessos ${s.fgm}/${s.fga} · 3 pts ${s.tpm}/${s.tpa} · LL ${s.ftm}/${s.fta} · Roubos ${s.stl} · Tocos ${s.blk} · Erros ${s.to}</p>
        ${res.goals.map((g) => `<div class="req">${g.done ? '✅' : '❌'} ${g.g.txt} <b class="${g.done ? 'ok' : ''}">${g.done ? '🪙 +' + g.g.coins : `${g.val}/${g.g.goal}`}</b></div>`).join('')}
        <div class="kv"><div><small>Moedas</small><b>🪙 +${coins}</b></div><div><small>Popularidade</small><b>+${xp} XP</b></div>${kind === 'national' && res.win ? '<div><small>Gemas</small><b>💎 +8</b></div>' : ''}</div></div>
      <button class="btn y big" data-a="resultOk">CONTINUAR</button>`;
    SND.play('coin');
    queue = [];
    if (ups) queue.push(() => { SND.play('levelup'); modal('SUBIU DE NÍVEL!', `<p class="txt center">Sua popularidade chegou ao <b>nível ${S.level}</b>!<br>Recompensa: 💎 ${ups * 5}</p><button class="btn y big" data-a="close">LEGAL!</button>`); });
    if (called) queue.push(() => { SND.play('win'); modal('CONVOCADO!', `<p class="txt center">🇧🇷 O técnico da <b>Seleção</b> chamou você!<br>Os amistosos estão liberados na aba <b>Partidas</b>.</p><button class="btn y big" data-a="close">VAMOS!</button>`); });
    if (kind === 'league' && seasonOver()) queue.push(seasonEnd);
  }
  function seasonEnd() {
    const pos = myPos(), champ = pos === 1, prize = { coins: [3000, 1800, 1200][pos - 1] || 500, gems: champ ? 30 : pos <= 3 ? 10 : 0 };
    const cur = team(), better = TEAMS.filter((t) => t.stars > cur.stars && t.stars <= cur.stars + 1 && (pos <= 4 || S.level >= 5)), offer = better.length ? better[0] : null;
    modal(champ ? '🏆 CAMPEÃO!' : 'FIM DA TEMPORADA', `<p class="txt center">${cur.name} terminou em <b>${pos}º lugar</b>.<br>Sua campanha: <b>${S.season.my.pts} pontos</b>, nota média <b>${avg(S.season.my.rate, S.season.my.g)}</b>.<br>Prêmio: ${rewardTxt(prize)}</p>
      ${offer ? `<div class="item"><span class="ic2">📨</span><div class="grow"><h4>Proposta: ${offer.name}</h4><small>Um clube mais forte quer você! ${offer.stars} estrelas.</small></div><button class="btn g sm" data-a="newSeason:${offer.id}">Aceitar</button></div>` : ''}
      <button class="btn y big" data-a="newSeason:${cur.id}">${offer ? 'FICAR NO CLUBE' : 'NOVA TEMPORADA'}</button>`, { noX: true });
    if (!S.season.paid) { S.season.paid = true; grant(prize); if (champ) S.career.titles++; saveGame(); SND.play(champ ? 'win' : 'coin'); }
  }
  function trainResult(r) {
    const I = Train.INFO[r.kind], xp = 12 + r.stars * 22, g = addTrainXP(xp), coins = r.stars * 30;
    S.coins += coins; dailyProgress('train', 1); saveGame();
    modal(I.name, `<div class="center" style="font-size:2.6em">${'⭐'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}</div>
      <p class="txt center">${r.kind === 'cones' ? `Tempo: <b>${r.val.toFixed(1)}s</b>` : `Acertos: <b>${r.val}</b>`}<br>Treino <b>+${g.n} XP</b> · 🪙 +${coins}${g.up ? `<br><b>Treino subiu para o nível ${S.training.level}!</b>` : ''}</p>
      <div class="row"><button class="btn d grow" data-a="trainBack">Voltar</button><button class="btn y grow" data-a="train:${r.kind}" ${S.trainLeft > 0 ? '' : 'disabled'}>De novo (${S.trainLeft})</button></div>`, { noX: true });
    if (g.up) SND.play('levelup');
  }

  /* ----- ações (delegação de cliques via data-a="nome:arg") ----- */
  const buy = (cost, cur = 'coins') => { if (S[cur] < cost) { SND.play('error'); HUD.toast(cur === 'coins' ? 'Moedas insuficientes!' : 'Gemas insuficientes!'); return false; } S[cur] -= cost; SND.play('coin'); return true; };
  const ACT = {
    tab: (t) => show(t), close: () => closeModal(),
    tasks: tasksModal, objectives: objectivesModal, customize: customizeModal, howto: howtoModal, standings: standingsModal, calendar: calendarModal,
    leaders: (k) => leadersModal(k), settings: () => settingsModal(false), settingsM: () => settingsModal(true),
    pre: (k) => openPre(k), back: () => show('home'), boosts: boostsModal, go,
    seasonEnd, nextPeriod: () => { closeModal(); Match.nextPeriod(); },
    resume: () => { closeModal(); Match.pause(false); },
    watch: () => { closeModal(); Match.pause(false); },
    simEnd: () => { closeModal(); Match.pause(false); Match.fastForward(); },
    timeout: () => { const e = Match.pause(false) || Match.timeout(0); if (e) { Match.pause(true); HUD.toast(e); } else closeModal(); },
    quit: () => { closeModal(); Game.toMenu(); show('home'); HUD.toast('Partida abandonada.'); },
    resultOk: () => { Game.toMenu(); show('home'); if (queue.length) queue.shift()(); },
    claimTask: (i) => { const t = S.daily.tasks[i], d = TASK_POOL.find((x) => x.id === t.id); if (t.done || t.prog < d.goal) return; t.done = true; grant(d); SND.play('coin'); saveGame(); tasksModal(); render(); },
    claimObj: (id) => { const o = OBJECTIVES.find((x) => x.id === id); if (S.claimed[id] || objVal(o) < o.goal) return; S.claimed[id] = true; grant(o); SND.play('coin'); saveGame(); objectivesModal(); render(); },
    claimEvent: () => { const e = S.daily.event, d = EVENT_POOL.find((x) => x.id === e.id); if (e.done || e.prog < d.goal) return; e.done = true; grant(d); SND.play('win'); saveGame(); render(); },
    login: () => { if (S.daily.login) return; S.daily.login = true; S.coins += 150; S.energy = Math.min(energyMax(), S.energy + 2); SND.play('coin'); saveGame(); render(); HUD.toast('Bônus diário: 🪙 150 e ⚡ +2'); },
    buyBoost: (k) => { if (!buy(BOOST[k].cost)) return; S.boosters[k]++; saveGame(); if (PRE) boostsModal(); else render(); refreshTop(); },
    useBoost: (k) => { const b = PRE.boost; if (b[k]) delete b[k]; else { if (Object.keys(b).length >= 3) return HUD.toast('Máximo de 3 melhorias por partida.'); b[k] = true; } boostsModal(); },
    buyEnergy: () => { if (S.energy >= energyMax()) return HUD.toast('Energia já está cheia!'); if (!buy(10, 'gems')) return; S.energy = energyMax(); saveGame(); render(); },
    buyCoins: () => { if (!buy(10, 'gems')) return; S.coins += 600; saveGame(); render(); },
    buyTrain: () => { if (!buy(120)) return; S.trainLeft++; saveGame(); render(); },
    lifeUp: () => { const n = LIFE[S.lifestyle]; if (!n || !buy(n.cost)) return; S.lifestyle++; SND.play('levelup'); saveGame(); render(); HUD.toast(`${n.ic} ${n.name}: ${n.bonus}`); checkCall(); },
    trainInfo: (k) => { const i = Train.INFO[k]; modal(i.name, `<p class="txt center">${i.desc}</p><div class="kv">${[1, 2, 3].map((n) => `<div><small>${'⭐'.repeat(n)}</small><b>${k === 'cones' ? '≤ ' + i.stars[n - 1] + 's' : i.stars[n - 1] + '+'}</b></div>`).join('')}</div><p class="txt center">Cada estrela rende mais XP de treino e moedas.</p><button class="btn y big" data-a="train:${k}">JOGAR</button>`); },
    train: (k) => { if (S.trainLeft <= 0) { SND.play('error'); return HUD.toast('Sem treinos nesta rodada. Jogue uma partida ou compre uma sessão.'); } S.trainLeft--; saveGame(); closeModal(); hideMenus(); Game.startTraining(k); },
    trainBack: () => { closeModal(); Game.toMenu(); show('events'); checkCall(); },
    custTab: (k) => { custTab = k; customizeModal(); },
    look: (key, v) => {
      v = +v; const own = S.owned[key], list = { hair: HAIRS, face: FACES, shoes: SHOES }[key];
      if (own && !own.includes(v)) { if (!buy(list[v].cost)) return; own.push(v); }
      S.look[key] = v; saveGame(); customizeModal(); refreshTop();
    },
    toggle: (k) => { S.settings[k] = !S.settings[k]; saveGame(); if (k === 'shadows') GFX.setShadows(S.settings.shadows); SND.music(Game.mode === 'menu'); settingsModal(Game.mode === 'match'); },
    qlen: (q) => { S.settings.qlen = +q; saveGame(); settingsModal(Game.mode === 'match'); },
    reset: () => modal('APAGAR TUDO?', '<p class="txt center">Isso apaga sua carreira inteira e não pode ser desfeito.</p><div class="row"><button class="btn d grow" data-a="close">Cancelar</button><button class="btn r grow" data-a="resetYes">Apagar</button></div>'),
    resetYes: () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* sem acesso */ } loadGame(); closeModal(); show('home'); },
    newSeason: (id) => { S.teamId = +id; S.season = newSeason(S.season.year + 1); saveGame(); closeModal(); show('home'); HUD.toast(`Temporada ${S.season.year}: ${team().name}`); },
  };
  function checkCall() {
    const r = natReq();
    if (!S.national.called && r.pop && r.life && r.train) { S.national.called = true; saveGame(); later(() => { SND.play('win'); modal('CONVOCADO!', '<p class="txt center">🇧🇷 O técnico da <b>Seleção</b> chamou você!<br>Os amistosos estão liberados na aba <b>Partidas</b>.</p><button class="btn y big" data-a="close">VAMOS!</button>'); }); }
  }
  function init() {
    $('#ui').addEventListener('click', (e) => {
      const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
      const [name, ...args] = t.dataset.a.split(':');
      if (ACT[name]) { SND.init(); SND.play('click'); ACT[name](...args); }
    });
    document.querySelectorAll('.nav').forEach((b) => b.addEventListener('click', () => { SND.play('click'); show(b.dataset.tab); }));
    $('#m-x').addEventListener('click', () => { SND.play('click'); closeModal(); });
    $('#t-set').addEventListener('click', () => { SND.play('click'); settingsModal(false); });
    setInterval(() => { if (Game.mode === 'menu' && !PRE) refreshTop(); }, 5000);
  }
  return { init, show, modal, closeModal, result, trainResult, pauseMenu, refreshTop, get tab() { return tab; }, get modalOpen() { return modalOpen; } };
})();

/* =====================================================================
   Arquivo 07: laço principal e troca de modos (menu / partida / treino)
   ===================================================================== */
const Game = (() => {
  let mode = 'menu', last = 0, stageKind = 'none', models = [], kind = 'league', started = false, endT = 0;
  const $ = U.$;

  // "vitrine" 3D dos menus: seu jogador no centro da quadra (e o rival no pré-jogo)
  function stage(k, opp, my) {
    models.forEach(GFX.disposeModel); models = []; stageKind = k;
    if (k === 'none' || !started) return;
    const t = my || TEAMS[S.teamId];
    GFX.paintCourt(t.c1, t.c2);
    const me = GFX.makeModel(Object.assign({}, S.look, { c1: t.c1, c2: t.c2 }));
    models.push(me);
    if (k === 'pre') {
      me.g.position.set(-0.62, 0, 0); me.g.rotation.y = 0.28;
      const o = GFX.makeModel({ skin: U.randi(0, 5), hair: U.randi(1, 5), hairColor: U.randi(0, 3), face: U.randi(1, 2), shoes: U.randi(0, 5), num: U.randi(4, 33), c1: opp.c1, c2: opp.c2 });
      o.g.position.set(0.62, 0, 0); o.g.rotation.y = -0.28; models.push(o);
    }
    GFX.ball.position.set(k === 'pre' ? 0 : 0.55, CT.BALL_R, 0.45);
    GFX.setBoard('CUBOLA');
  }
  const matchHandler = {
    origin: () => (Match.canAim() ? Match.userScreen() : null),
    aimStart: () => Match.aimStart(), aimMove: (p, d) => Match.aimMove(p, d), aimEnd: (c) => Match.aimEnd(c),
    aiming: () => Match.state.aim.on, tap: (x, y) => Match.tapPass(x, y),
    key: (k) => { const m = Match.view().mode; Match.act(k === 'q' ? (m === 'ball' ? 'dribble' : 'steal') : k); },
  };
  function startMatch(cfg, k) {
    kind = k; mode = 'match'; stage('none'); endT = 0;
    Match.start(cfg, (res) => { endT = performance.now() + (Match.state.headless ? 300 : 2600); Game._res = res; });
    Input.setHandler(matchHandler); HUD.show('match');
    SND.music(false); SND.crowd(1);
  }
  function startTraining(k) {
    mode = 'train'; stage('none');
    HUD.show('train');
    Train.start(k, (r) => UI.trainResult(r));
    SND.music(false); SND.crowd(0.4);
  }
  function quitTraining() { if (mode === 'train' && Train.state.on) Train.finish(); }
  function toMenu() {
    mode = 'menu'; Match.stop(); Train.stop(); Input.setHandler(null); HUD.show(null); Game._res = null; endT = 0;
    SND.music(true); SND.crowd(0.25);
  }

  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    if (!started) return;
    Input.update(dt);
    if (mode === 'match') {
      Match.update(dt); Match.sync(dt);
      if (endT && t > endT && Game._res) { const r = Game._res; Game._res = null; endT = 0; UI.closeModal(); HUD.show(null); Input.setHandler(null); UI.result(r, kind); }
    } else if (mode === 'train') Train.update(dt);
    else {
      if (stageKind === 'none') return;                 // painel opaco por cima: não precisa renderizar
      models.forEach((m, i) => GFX.animate(m, stageKind === 'pre' ? 'hips' : 'idle', 0, dt));
      const k = 1 - Math.exp(-dt * 6);
      GFX.setFov(46);
      if (stageKind === 'home') GFX.cam(0, 1.55, 5.3, 0, 0.98, 0, k);
      else if (stageKind === 'custom') GFX.cam(0, 1.7, 7.4, 0, -0.75, 0, k);
      else GFX.cam(0, 1.5, 5.6, 0, 0.92, 0, k);
    }
    HUD.update(dt); GFX.update(dt); GFX.render();
  }

  function fit() { const w = $('#stage').getBoundingClientRect().width; document.documentElement.style.setProperty('--sw', w + 'px'); if (started) GFX.resize(); }
  function boot() {
    if (!window.THREE) {
      document.body.insertAdjacentHTML('beforeend', '<div id="err"><div><h2>Não foi possível carregar o motor 3D</h2><p>O jogo precisa de internet na primeira abertura para baixar o Three.js. Verifique a conexão e recarregue a página.</p></div></div>');
      return;
    }
    loadGame(); fit(); window.addEventListener('resize', fit);
    GFX.init($('#gl')); GFX.setShadows(S.settings.shadows);
    Input.init($('#touch')); HUD.init(); UI.init();
    started = true; fit();
    GFX.cam(0, 1.55, 5.3, 0, 0.98, 0, 1);
    $('#splash').addEventListener('click', () => {
      SND.init(); SND.play('click'); $('#splash').classList.add('hidden');
      UI.show('home'); SND.music(true); SND.crowd(0.25);
    }, { once: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (mode === 'match' && !Match.state.paused && !UI.modalOpen) UI.pauseMenu(); SND.music(false); } else if (mode === 'menu') SND.music(true);
    });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    requestAnimationFrame(frame);
  }
  return { boot, stage, startMatch, startTraining, quitTraining, toMenu, get mode() { return mode; }, _res: null };
})();

// ganchos de depuração/testes (console): CUBOLA.Match.simulate({...})
window.CUBOLA = { Game, Match, Train, UI, HUD, GFX, get save() { return S; }, TEAMS };
Game.boot();

</script>
